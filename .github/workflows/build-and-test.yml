name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build Solution and Run Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: dotnet restore StickyNotes.sln

      - name: Run Unit Tests
        run: dotnet test StickyNotes.Tests/StickyNotes.Tests.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=test_results.trx"

      - name: Build Solution (x64 Release)
        run: msbuild StickyNotes.sln /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: StickyNotes.Tests/TestResults/test_results.trx

      - name: Upload Binary Artifact (StickyNotes.App)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StickyNotes-x64-Release
          path: StickyNotes.App/bin/x64/Release/net8.0-windows10.0.19041.0/
